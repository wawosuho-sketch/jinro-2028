<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>세종고등학교 2028 진학상담 리포트</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      color: #f6f1e7;
      background: #100e0c;
      overflow-x: hidden;
    }
    .hall {
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse at 50% 18%, rgba(255,214,140,.28), transparent 42%),
        linear-gradient(180deg, rgba(8,10,12,.2), rgba(8,10,12,.78)),
        url("hall.jpg") center/cover no-repeat;
      transform: scale(1.08);
      animation: drift 28s ease-in-out infinite alternate;
      filter: saturate(1.15);
    }
    .vignette {
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,.72) 100%);
      pointer-events: none;
    }
    .beam {
      position: fixed; top: -10%; left: 18%; width: 28vw; height: 130%;
      background: linear-gradient(180deg, rgba(255,236,196,.28), transparent 70%);
      filter: blur(8px);
      transform: rotate(12deg);
      animation: sweep 9s ease-in-out infinite;
      pointer-events: none;
    }
    .stage {
      position: relative; z-index: 1;
      max-width: 1080px; margin: 0 auto;
      padding: 36px 18px 64px;
      display: grid; grid-template-columns: 1.1fr .9fr; gap: 28px;
      align-items: center; min-height: 100vh;
    }
    .frame {
      position: relative; padding: 14px;
      background: linear-gradient(145deg, #8d6a32, #f3deaa 40%, #6d4d22 70%, #e7c98a);
      box-shadow: 0 30px 70px rgba(0,0,0,.55);
      animation: rise 1.1s ease both;
    }
    .frame img { display: block; width: 100%; height: 62vh; object-fit: cover; }
    .plaque {
      position: absolute; left: 50%; bottom: -18px; transform: translateX(-50%);
      background: #1a140e; color: #f3deaa; border: 1px solid #c8a15a;
      padding: 6px 14px; letter-spacing: .14em; font-size: 12px;
    }
    h1 { margin: 0 0 8px; font-size: 42px; line-height: 1.15; font-weight: 800; }
    .eyebrow { margin: 0 0 10px; letter-spacing: .22em; color: #e7c98a; font-size: 13px; }
    .lead { margin: 0 0 16px; line-height: 1.7; color: #f6f1e7; }
    .card {
      background: rgba(16,14,12,.72);
      border: 1px solid rgba(231,201,138,.45);
      backdrop-filter: blur(6px);
      padding: 22px 20px 18px;
      animation: rise 1.1s .15s ease both;
    }
    .caution { margin: 0 0 16px; padding: 12px 12px 4px; background: rgba(255,248,230,.08); }
    .caution strong { color: #f3deaa; }
    .caution li { margin: 0 0 8px; line-height: 1.55; }
    a { color: #f3deaa; }
    label { display: block; margin: 12px 0 6px; font-weight: 700; }
    input {
      width: 100%; padding: 12px; border: 1px solid #c8a15a; border-radius: 0;
      background: rgba(255,255,255,.94); color: #17212b; font-size: 18px;
    }
    button {
      margin-top: 16px; width: 100%; border: 0; background: #f3deaa; color: #1a140e;
      padding: 13px; font-size: 16px; font-weight: 800; letter-spacing: .08em; cursor: pointer;
    }
    button:hover { background: #fff6df; }
    .err { min-height: 1.4em; color: #ffb4a8; font-weight: 700; }
    #viewer { display: none; position: fixed; inset: 0; z-index: 5; background: #fff; }
    #viewer iframe { width: 100%; height: calc(100% - 52px); border: 0; background: #fff; }
    #bar {
      height: 52px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px; background: #1a140e; color: #f3deaa;
    }
    #bar button { width: auto; margin: 0; padding: 8px 14px; }
    @keyframes drift { from { transform: scale(1.08) translate3d(0,0,0); } to { transform: scale(1.16) translate3d(-2%, -1%, 0); } }
    @keyframes sweep { 0%,100% { opacity: .35; } 50% { opacity: .85; } }
    @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
    @media (max-width: 860px) {
      .stage { grid-template-columns: 1fr; padding-top: 18px; }
      .frame img { height: 34vh; }
      h1 { font-size: 32px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .hall, .beam, .frame, .card { animation: none; }
    }
  </style>
</head>
<body>
  <div class="hall"></div>
  <div class="vignette"></div>
  <div class="beam"></div>
  <main class="stage" id="gate">
    <figure class="frame">
      <img src="canvas.jpg" alt="전시실의 큰 그림">
      <figcaption class="plaque">SEJONG HIGH SCHOOL</figcaption>
    </figure>
    <section class="card">
      <p class="eyebrow">세종시 세종고등학교</p>
      <h1>2028 진학상담 리포트</h1>
      <p class="lead">이 자료는 세종고등학교가 학생 상담을 위해 만든 학교 고유 자료입니다. 본인 학번과 담임에게 받은 비밀번호로만 열립니다.</p>
      <div class="caution">
        <strong>활용할 때 지킬 일</strong>
        <ul>
          <li>이 페이지가 열려 있는 시간에만 봅니다. 열람 시간이 지난 뒤 자료가 필요하면 담임선생님께 문의합니다.</li>
          <li>합격 예측표가 아닙니다. 숫자의 의미는 <a href="guide.html">리포트 이용 안내서</a>와 함께 읽습니다.</li>
        </ul>
      </div>
      <form id="form">
        <label for="sid">학번</label>
        <input id="sid" name="sid" inputmode="numeric" autocomplete="username" placeholder="20101" maxlength="5" required>
        <label for="pw">비밀번호</label>
        <input id="pw" name="pw" type="password" autocomplete="current-password" placeholder="8자리" required>
        <button type="submit">전시실 열기</button>
      </form>
      <p class="err" id="err" role="alert"></p>
    </section>
  </main>
  <div id="viewer">
    <div id="bar"><strong>세종고등학교 진학상담 리포트</strong><button type="button" id="close">닫기</button></div>
    <iframe id="frame" title="진학상담 리포트" sandbox="allow-scripts allow-modals allow-popups"></iframe>
  </div>
  <script>
    const form = document.getElementById("form");
    const err = document.getElementById("err");
    const frame = document.getElementById("frame");
    function sidOf(value) {
      const digits = String(value || "").replace(/\D/g, "");
      if (/^2\d{4}$/.test(digits)) {
        return "2-" + Number(digits.slice(1, 3)) + "-" + digits.slice(3);
      }
      const m = String(value || "").trim().match(/^(\d+)\s*-\s*(\d+)\s*-\s*(\d+)$/);
      if (!m) return "";
      return m[1] + "-" + Number(m[2]) + "-" + String(Number(m[3])).padStart(2, "0");
    }
    function fail() { err.textContent = "학번 또는 비밀번호가 맞지 않습니다."; }
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      err.textContent = "문을 여는 중입니다.";
      const sid = sidOf(document.getElementById("sid").value);
      const password = document.getElementById("pw").value.trim();
      if (!sid || password.length < 8) { fail(); return; }
      try {
        const catalog = await (await fetch("catalog.json", { cache: "no-store" })).json();
        const file = catalog.students[sid];
        if (!file) { fail(); return; }
        const buf = await (await fetch("d/" + file, { cache: "no-store" })).arrayBuffer();
        const bytes = new Uint8Array(buf);
        if (new TextDecoder().decode(bytes.slice(0, 4)) !== "JR28") { fail(); return; }
        const iterations = new DataView(buf).getUint32(5);
        const salt = bytes.slice(9, 25);
        const iv = bytes.slice(25, 37);
        const data = bytes.slice(37);
        const material = await crypto.subtle.importKey(
          "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
        const key = await crypto.subtle.deriveKey(
          { name: "PBKDF2", salt, iterations, hash: "SHA-256" },
          material, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
        const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);
        document.getElementById("pw").value = "";
        frame.srcdoc = new TextDecoder().decode(plain);
        document.getElementById("gate").style.display = "none";
        document.getElementById("viewer").style.display = "block";
        err.textContent = "";
      } catch (e) {
        fail();
      }
    });
    document.getElementById("close").addEventListener("click", () => {
      frame.srcdoc = "";
      document.getElementById("viewer").style.display = "none";
      document.getElementById("gate").style.display = "block";
    });
  </script>
</body>
</html>
